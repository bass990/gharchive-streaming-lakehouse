name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests streaming
      - run: pytest -q
      - uses: hashicorp/setup-terraform@v3
      - run: cd deploy/aws && terraform init -backend=false -input=false >/dev/null && terraform validate

  integration:
    # broker + schema registry + object store + catalog, real producer, real Spark job, real Iceberg commit
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker compose up -d --wait redpanda minio iceberg-rest spark
      - name: produce a small slice of one archive hour
        run: python -m gh_stream.producer --hour 2025-09-22-15 --limit 5000
        env:
          KAFKA_BOOTSTRAP: localhost:19092
          SCHEMA_REGISTRY: http://localhost:18081
      - name: run the streaming job for one trigger and check the Iceberg table
        run: |
          docker compose exec -T spark /opt/spark/bin/spark-submit --master local[2] \
            --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.spark:spark-avro_2.12:3.5.3 \
            /app/streaming/stream_events.py &
          sleep 240
          python -m gh_stream.query "SELECT count(*) AS n, count(DISTINCT id) AS ids FROM events"
      - run: docker compose down -v
